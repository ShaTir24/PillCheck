[project]
name = "pillcheck-ml"
version = "0.1.0"
description = "PillCheck ML pipeline — Phase 0: dataset ingest + eval harness reproducing the ePillID baseline"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "pandas>=2.2",
    "numpy>=1.26,<2.1",
    "pillow>=10.4",
    "requests>=2.32",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "pytorch-metric-learning>=2.6",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripts", "eval", "train"]
