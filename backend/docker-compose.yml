services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pillcheck
      POSTGRES_PASSWORD: pillcheck
      POSTGRES_DB: pillcheck
    ports:
      - "5433:5432"
    volumes:
      - pillcheck-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pillcheck"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pillcheck-postgres-data:
